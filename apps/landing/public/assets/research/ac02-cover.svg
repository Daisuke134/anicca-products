<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img"><title>AC02 cover</title><rect width="960" height="500" rx="14" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="50" y="65" font-size="20" font-weight="bold" text-anchor="start" fill="#203a38">ANICCA RESEARCH / AC02</text><text x="50" y="140" font-size="46" font-weight="bold" text-anchor="start" fill="#203a38">Measure research autonomy</text><text x="50" y="187" font-size="27" font-weight="normal" text-anchor="start" fill="#203a38">Receipts are not independent acceptance</text><rect x="50" y="235" width="260" height="142" rx="12" fill="#e0e9e1"/><text x="70" y="300" font-size="38" font-weight="bold" text-anchor="start" fill="#203a38">8</text><text x="70" y="345" font-size="20" font-weight="normal" text-anchor="start" fill="#203a38">Saved receipts</text><rect x="340" y="235" width="260" height="142" rx="12" fill="#e0e9e1"/><text x="360" y="300" font-size="38" font-weight="bold" text-anchor="start" fill="#203a38">0</text><text x="360" y="345" font-size="20" font-weight="normal" text-anchor="start" fill="#203a38">PR approvals</text><rect x="630" y="235" width="260" height="142" rx="12" fill="#e0e9e1"/><text x="650" y="300" font-size="38" font-weight="bold" text-anchor="start" fill="#203a38">Unknown</text><text x="650" y="345" font-size="20" font-weight="normal" text-anchor="start" fill="#203a38">Autonomy rate</text><text x="50" y="450" font-size="19" font-weight="normal" text-anchor="start" fill="#203a38">Eight selected research topics; not a company-wide estimate.</text></g></svg>