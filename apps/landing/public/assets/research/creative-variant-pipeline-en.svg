<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img"><rect x="0" y="0" width="960" height="300" fill="#F9F9F6"/><text x="480" y="34" text-anchor="middle" fill="#3B3B39" font-family="Georgia, serif" font-size="19">Results are read in order, and aggregated by variable</text><text x="480" y="58" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="12.5">The reading order this gate enforces (CV-4), before any winner is named</text><rect x="30" y="110" width="160" height="90" fill="#FFFFFF" stroke="#5C8A95" stroke-width="1.5"/><text x="110" y="148" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14">1. Stop</text><text x="110" y="172" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">first second</text><text x="203" y="162" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="18">→</text><rect x="216" y="110" width="160" height="90" fill="#FFFFFF" stroke="#5C8A95" stroke-width="1.5"/><text x="296" y="148" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14">2. Retention</text><text x="296" y="172" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">early hold</text><text x="389" y="162" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="18">→</text><rect x="402" y="110" width="160" height="90" fill="#FFFFFF" stroke="#5C8A95" stroke-width="1.5"/><text x="482" y="148" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14">3. Click intent</text><text x="482" y="172" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">CTR</text><text x="575" y="162" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="18">→</text><rect x="588" y="110" width="160" height="90" fill="#FFFFFF" stroke="#5C8A95" stroke-width="1.5"/><text x="668" y="148" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14">4. Behaviour</text><text x="668" y="172" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">on-site / install</text><text x="761" y="162" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="18">→</text><rect x="774" y="110" width="160" height="90" fill="#FFFFFF" stroke="#5C8A95" stroke-width="1.5"/><text x="854" y="148" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14">5. Efficiency</text><text x="854" y="172" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">cost per result</text></svg>