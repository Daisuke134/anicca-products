<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>H27 method</title><rect width="960" height="480" rx="16" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="32" fill="#203a38">Disjoint student groups; training-only preprocessing</text><rect x="50" y="95" width="860" height="66" rx="8" fill="#e0e9e1"/><text x="70" y="136" font-size="24" fill="#203a38">Train</text><text x="320" y="136" font-size="24" fill="#203a38">122 groups / 37,308 pairs</text><rect x="50" y="185" width="860" height="66" rx="8" fill="#e0e9e1"/><text x="70" y="226" font-size="24" fill="#203a38">Validation</text><text x="320" y="226" font-size="24" fill="#203a38">32 groups / 8,369 pairs</text><rect x="50" y="275" width="860" height="66" rx="8" fill="#e0e9e1"/><text x="70" y="316" font-size="24" fill="#203a38">Test</text><text x="320" y="316" font-size="24" fill="#203a38">44 groups / 12,235 pairs</text><text x="50" y="430" font-size="23" fill="#203a38">Outcome: next student turn has at most 3 regex words.</text></g></svg>