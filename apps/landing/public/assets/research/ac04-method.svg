<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>AC04 method</title><rect width="960" height="480" rx="16" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="34" fill="#203a38">Search within a fixed budget</text><rect x="50" y="90" width="860" height="62" rx="10" fill="#e0e9e1"/><text x="70" y="129" font-size="24" fill="#203a38">Train</text><text x="300" y="129" font-size="22" fill="#203a38">80 updates per candidate</text><rect x="50" y="172" width="860" height="62" rx="10" fill="#e0e9e1"/><text x="70" y="211" font-size="24" fill="#203a38">Validation</text><text x="300" y="211" font-size="22" fill="#203a38">8 candidates; keep or discard</text><rect x="50" y="254" width="860" height="62" rx="10" fill="#e0e9e1"/><text x="70" y="293" font-size="24" fill="#203a38">Freeze</text><text x="300" y="293" font-size="22" fill="#203a38">Save selected weights and configuration</text><rect x="50" y="336" width="860" height="62" rx="10" fill="#e0e9e1"/><text x="70" y="375" font-size="24" fill="#203a38">Test</text><text x="300" y="375" font-size="22" fill="#203a38">Separate scoring command; no promotion</text><text x="50" y="455" font-size="18" fill="#203a38">Procedural separation, not an isolated sealed test.</text></g></svg>