<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290"><rect width="780" height="290" fill="white"/><g font-family="sans-serif" fill="#142537"><text x="20" y="32" font-size="23">Same GGUF, two inference engines</text><text x="20" y="56" font-size="14">Qwen2.5 1.5B Q4_K_M, M4 16GB, 8 reused synthetic tasks</text><text x="20" y="108" font-size="15">Ollama</text><rect x="160" y="86" width="464.5" height="27" fill="#008c95"/><text x="636" y="106">92.90 tok/s</text><text x="20" y="162" font-size="15">llama.cpp</text><rect x="160" y="140" width="417.4" height="27" fill="#64748b"/><text x="589" y="160">83.48 tok/s</text><text x="20" y="213" font-size="16">Both: 5/8 exact match; 8/8 valid JSON</text><text x="20" y="241" font-size="13">Engine-reported decode rates, not end-to-end latency; different constraint implementations.</text><text x="20" y="263" font-size="13">Magnitude: incompatible Qwen2; no inference. No quantization ablation.</text></g></svg>