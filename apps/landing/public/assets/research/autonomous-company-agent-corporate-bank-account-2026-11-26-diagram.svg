<svg xmlns="http://www.w3.org/2000/svg" width="920" height="730" viewBox="0 0 920 730">
<rect width="100%" height="100%" fill="white"/>
<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">The sequenced dual-bank route for a zero-human company</text>
<rect x="160" y="70" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">1. GK registered</text><text x="460" y="118" text-anchor="middle" font-size="15" fill="#444">registry + seal certificates</text><line x1="460" y1="132" x2="460" y2="162" stroke="#2563eb" stroke-width="2"/><polygon points="452,154 468,154 460,164" fill="#2563eb"/><rect x="160" y="162" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="188" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">2. Evidence pack</text><text x="460" y="210" text-anchor="middle" font-size="15" fill="#444">business plan, website, licence roadmap</text><line x1="460" y1="224" x2="460" y2="254" stroke="#2563eb" stroke-width="2"/><polygon points="452,246 468,246 460,256" fill="#2563eb"/><rect x="160" y="254" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">3. Apply: GMO Aozora (net bank first)</text><text x="460" y="302" text-anchor="middle" font-size="15" fill="#444">online, 1–2 weeks, software auth</text><line x1="460" y1="316" x2="460" y2="346" stroke="#2563eb" stroke-width="2"/><polygon points="452,338 468,338 460,348" fill="#2563eb"/><rect x="160" y="346" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">4. Move ¥5M capital into company account</text><text x="460" y="394" text-anchor="middle" font-size="15" fill="#444">licence asset-test evidence starts</text><line x1="460" y1="408" x2="460" y2="438" stroke="#2563eb" stroke-width="2"/><polygon points="452,430 468,430 460,440" fill="#2563eb"/><rect x="160" y="438" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="464" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">5. Operate 3–6 months</text><text x="460" y="486" text-anchor="middle" font-size="15" fill="#444">payroll, tax, real receipts</text><line x1="460" y1="500" x2="460" y2="530" stroke="#2563eb" stroke-width="2"/><polygon points="452,522 468,522 460,532" fill="#2563eb"/><rect x="160" y="530" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="556" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">6. Apply: megabank (second)</text><text x="460" y="578" text-anchor="middle" font-size="15" fill="#444">WEB interview, ~4 weeks, with history</text><line x1="460" y1="592" x2="460" y2="622" stroke="#2563eb" stroke-width="2"/><polygon points="452,614 468,614 460,624" fill="#2563eb"/><rect x="160" y="622" width="600" height="62" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="460" y="648" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">7. Dual-bank steady state</text><text x="460" y="670" text-anchor="middle" font-size="15" fill="#444">agent-operated + credibility rails</text></svg>