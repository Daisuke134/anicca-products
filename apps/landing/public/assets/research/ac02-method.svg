<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img"><title>AC02 method</title><rect width="960" height="500" rx="14" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="50" y="57" font-size="35" font-weight="bold" text-anchor="start" fill="#203a38">Four distinct evidence channels</text><rect x="50" y="100" width="860" height="65" rx="10" fill="#e0e9e1"/><text x="72" y="140" font-size="25" font-weight="bold" text-anchor="start" fill="#203a38">Receipt</text><text x="350" y="140" font-size="22" font-weight="normal" text-anchor="start" fill="#203a38">Pinned artifact + hash</text><rect x="50" y="188" width="860" height="65" rx="10" fill="#e0e9e1"/><text x="72" y="228" font-size="25" font-weight="bold" text-anchor="start" fill="#203a38">Acceptance</text><text x="350" y="228" font-size="22" font-weight="normal" text-anchor="start" fill="#203a38">Independent outcome review</text><rect x="50" y="276" width="860" height="65" rx="10" fill="#e0e9e1"/><text x="72" y="316" font-size="25" font-weight="bold" text-anchor="start" fill="#203a38">Human time</text><text x="350" y="316" font-size="22" font-weight="normal" text-anchor="start" fill="#203a38">Active minutes, not agent runtime</text><rect x="50" y="364" width="860" height="65" rx="10" fill="#e0e9e1"/><text x="72" y="404" font-size="25" font-weight="bold" text-anchor="start" fill="#203a38">Actual cost</text><text x="350" y="404" font-size="22" font-weight="normal" text-anchor="start" fill="#203a38">Attributed expenses, not estimates</text><text x="50" y="475" font-size="19" font-weight="normal" text-anchor="start" fill="#203a38">Missing evidence stays unknown; no inferred zero.</text></g></svg>