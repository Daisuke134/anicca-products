<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" role="img">
<rect x="0" y="0" width="960" height="532" fill="#F9F9F6"/>
<text x="480" y="34" text-anchor="middle" fill="#3B3B39" font-family="Georgia, serif" font-size="19">How the self-talk gate works</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B3B39"/></marker></defs>
<rect x="200" y="80" width="560" height="54" rx="9" fill="#FFFFFF" stroke="#3B3B39" stroke-width="1.4"/>
<text x="480" y="103" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14.5" font-weight="600">Inventory the surfaces</text>
<text x="480" y="122" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">per app: where words meet a next action</text>
<text x="186" y="112" text-anchor="end" fill="#5C8A95" font-family="sans-serif" font-size="12.5" font-weight="700">STEP 1</text>
<line x1="480" y1="134" x2="480" y2="165" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="168" width="560" height="54" rx="9" fill="#FFFFFF" stroke="#3B3B39" stroke-width="1.4"/>
<text x="480" y="191" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14.5" font-weight="600">Match the cue to the task</text>
<text x="480" y="210" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">instructional for precise or new steps; motivational for effort</text>
<text x="186" y="200" text-anchor="end" fill="#5C8A95" font-family="sans-serif" font-size="12.5" font-weight="700">STEP 2</text>
<line x1="480" y1="222" x2="480" y2="253" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="256" width="560" height="54" rx="9" fill="#FFFFFF" stroke="#3B3B39" stroke-width="1.4"/>
<text x="480" y="279" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14.5" font-weight="600">The user chooses and practises</text>
<text x="480" y="298" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">a short cue, trained — not only delivered</text>
<text x="186" y="288" text-anchor="end" fill="#5C8A95" font-family="sans-serif" font-size="12.5" font-weight="700">STEP 3</text>
<line x1="480" y1="310" x2="480" y2="341" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="344" width="560" height="54" rx="9" fill="#FFFFFF" stroke="#3B3B39" stroke-width="1.4"/>
<text x="480" y="367" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14.5" font-weight="600">Tie it to the next action</text>
<text x="480" y="386" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">a specific upcoming step, not a generic mood claim</text>
<text x="186" y="376" text-anchor="end" fill="#5C8A95" font-family="sans-serif" font-size="12.5" font-weight="700">STEP 4</text>
<line x1="480" y1="398" x2="480" y2="429" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="432" width="560" height="54" rx="9" fill="#FFFFFF" stroke="#3B3B39" stroke-width="1.4"/>
<text x="480" y="455" text-anchor="middle" fill="#3B3B39" font-family="sans-serif" font-size="14.5" font-weight="600">Measure separately, then follow up</text>
<text x="480" y="474" text-anchor="middle" fill="#969592" font-family="sans-serif" font-size="11.5">task completion apart from affect; not only immediate calm</text>
<text x="186" y="464" text-anchor="end" fill="#5C8A95" font-family="sans-serif" font-size="12.5" font-weight="700">STEP 5</text>
</svg>