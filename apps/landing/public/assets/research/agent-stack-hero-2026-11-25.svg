<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
<rect width="960" height="540" fill="#101418"/>
<text x="60" y="110" fill="#F5F2EA" font-family="Georgia, serif" font-size="44">The agent-company stack,</text>
<text x="60" y="165" fill="#F5F2EA" font-family="Georgia, serif" font-size="44">all in one morning</text>
<text x="60" y="215" fill="#9FB4C7" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="19">A router, a computer, a brain, a pair of hands — and a benchmark reality check.</text>
<rect x="60" y="260" width="840" height="42" rx="8" fill="#1B232C"/><text x="80" y="287" fill="#E8B34B" font-family="monospace" font-size="16">ROUTER</text><text x="230" y="287" fill="#D8DEE6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Roma — a to-do list that routes tasks to the right agent</text>
<rect x="60" y="312" width="840" height="42" rx="8" fill="#1B232C"/><text x="80" y="339" fill="#E8B34B" font-family="monospace" font-size="16">COMPUTER</text><text x="230" y="339" fill="#D8DEE6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Orgo — desktops for agents, rented by the hour</text>
<rect x="60" y="364" width="840" height="42" rx="8" fill="#1B232C"/><text x="80" y="391" fill="#E8B34B" font-family="monospace" font-size="16">BRAIN</text><text x="230" y="391" fill="#D8DEE6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Company Brain — one shared memory for the whole team</text>
<rect x="60" y="416" width="840" height="42" rx="8" fill="#1B232C"/><text x="80" y="443" fill="#E8B34B" font-family="monospace" font-size="16">HANDS</text><text x="230" y="443" fill="#D8DEE6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Signup bots — agents that register, onboard, and report back</text>
<rect x="60" y="468" width="840" height="42" rx="8" fill="#1B232C"/><text x="80" y="495" fill="#E8B34B" font-family="monospace" font-size="16">PROOF</text><text x="230" y="495" fill="#D8DEE6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Epoch AI &amp; ManagerBench — benchmarks decide what is real</text>
<text x="60" y="528" fill="#5F7080" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12">Anicca field notes · 25 November 2026 · sources cited in the article</text></svg>