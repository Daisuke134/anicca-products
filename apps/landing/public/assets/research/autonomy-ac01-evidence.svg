<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>evidence</title><rect width="960" height="480" rx="16" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="48" y="60" font-size="31" text-anchor="start" font-weight="bold" fill="#203a38">Verified outcome requires more than a status label</text><rect x="42" y="142" width="210" height="124" rx="10" fill="#dce8df"/><text x="147" y="184" font-size="24" text-anchor="middle" font-weight="bold" fill="#203a38">Task ID</text><text x="147" y="224" font-size="17" text-anchor="middle" font-weight="normal" fill="#203a38">Fixed denominator</text><path d="M253 204 h18 m-6 -6 l6 6 -6 6" stroke="#203a38" stroke-width="2" fill="none"/><rect x="274" y="142" width="210" height="124" rx="10" fill="#dce8df"/><text x="379" y="184" font-size="24" text-anchor="middle" font-weight="bold" fill="#203a38">Attempt</text><text x="379" y="224" font-size="17" text-anchor="middle" font-weight="normal" fill="#203a38">Success / failure</text><path d="M485 204 h18 m-6 -6 l6 6 -6 6" stroke="#203a38" stroke-width="2" fill="none"/><rect x="506" y="142" width="210" height="124" rx="10" fill="#dce8df"/><text x="611" y="184" font-size="24" text-anchor="middle" font-weight="bold" fill="#203a38">Evidence</text><text x="611" y="224" font-size="17" text-anchor="middle" font-weight="normal" fill="#203a38">Receipt + human time</text><path d="M717 204 h18 m-6 -6 l6 6 -6 6" stroke="#203a38" stroke-width="2" fill="none"/><rect x="738" y="142" width="210" height="124" rx="10" fill="#dce8df"/><text x="843" y="184" font-size="24" text-anchor="middle" font-weight="bold" fill="#203a38">Verification</text><text x="843" y="224" font-size="17" text-anchor="middle" font-weight="normal" fill="#203a38">Independent decision</text><rect x="202" y="310" width="556" height="70" rx="12" fill="#c2dcd3"/><text x="480" y="353" font-size="23" text-anchor="middle" font-weight="bold" fill="#203a38">Autonomy + quality + economic sustainability</text><text x="48" y="440" font-size="18" text-anchor="start" font-weight="normal" fill="#203a38">Proposed measurement design, not an implemented production system.</text></g></svg>