<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>AC06 method</title><rect width="960" height="480" rx="16" fill="#f7f5ee"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="34" fill="#203a38">One numerator, two denominators</text><text x="50" y="115" font-size="22" fill="#203a38">Submitted tasks</text><rect x="50" y="125" width="500" height="35" fill="#d7dfd9"/><rect x="50" y="125" width="470" height="35" fill="#25806d"/><text x="50" y="192" font-size="23" fill="#203a38">47 / 50 = 94%</text><text x="50" y="225" font-size="22" fill="#203a38">Planned tasks</text><rect x="50" y="235" width="750" height="35" fill="#d7dfd9"/><rect x="50" y="235" width="470" height="35" fill="#25806d"/><text x="50" y="302" font-size="23" fill="#203a38">47 / 75 = 62.67%</text><text x="50" y="440" font-size="18" fill="#203a38">Maximum hypothetical case: 25 missing submissions.</text></g></svg>