<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="12-month paid subscription retention by plan"><rect width="1000" height="550" fill="#fff"/><g font-family="sans-serif" fill="#14242d"><text x="40" y="48" font-size="28" font-weight="bold">AI apps retain fewer paid subscribers at 12 months</text><rect x="45" y="77" width="20" height="20" fill="#117b76"/><text x="75" y="94" font-size="19">AI</text><rect x="150" y="77" width="20" height="20" fill="#64748b"/><text x="180" y="94" font-size="19">Non-AI</text><text x="40" y="167" font-size="22">Weekly</text><rect x="180" y="140" width="52.5" height="30" fill="#117b76"/><text x="242.5" y="162" font-size="19">2.5%</text><rect x="180" y="175" width="71.39999999999999" height="30" fill="#64748b"/><text x="261.4" y="197" font-size="19">3.4%</text><text x="40" y="271" font-size="22">Monthly</text><rect x="180" y="244" width="128.1" height="30" fill="#117b76"/><text x="318.1" y="266" font-size="19">6.1%</text><rect x="180" y="279" width="199.5" height="30" fill="#64748b"/><text x="389.5" y="301" font-size="19">9.5%</text><text x="40" y="375" font-size="22">Annual</text><rect x="180" y="348" width="443.1" height="30" fill="#117b76"/><text x="633.1" y="370" font-size="19">21.1%</text><rect x="180" y="383" width="644.6999999999999" height="30" fill="#64748b"/><text x="834.6999999999999" y="405" font-size="19">30.7%</text><path d="M180 125V435H915" stroke="#b0b8bf" fill="none"/><text x="180" y="461" font-size="18">0%</text><text x="890" y="461" font-size="18">35%</text><text x="40" y="501" font-size="16">Source: RevenueCat, State of Subscription Apps 2026. Overall dataset: 115,000+ apps.</text><text x="40" y="525" font-size="16">Subgroup n not verified. Observational comparison; not Anicca results.</text></g></svg>
