ill="#111">SBI Sumishin / DOCOMO SMTB</text><rect x="340" y="264" width="60" height="26" rx="4" fill="#2563eb"/><text x="414" y="282" font-size="16" fill="#333">1–2 weeks (practitioner)</text><text x="268" y="339" text-anchor="end" font-size="17" fill="#111">PayPay Bank</text><rect x="340" y="322" width="60" height="26" rx="4" fill="#2563eb"/><text x="414" y="340" font-size="16" fill="#333">1–2 weeks (practitioner)</text>
<text x="280" y="408" font-size="14" fill="#666">Weeks. Source: MUFG published guidance and AQ Partners / VisaHow practitioner guides, checked 2026-11-26 (n = 5 routes).</text>
