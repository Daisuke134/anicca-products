<text x="480" y="322" text-anchor="middle" fill="#969592" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5">Source: Capafy sales API + OpenRouter key usage, measured 21 November 2026 (anicca-ops files/capafy-openrouter-pnl-2026-11-21.md); 30-day figure re-measured 25 November.</text>
