<text x="480.0" y="289" text-anchor="middle" fill="#3B3B39" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Carrying sleep debt and low energy?</text>
<text x="480.0" y="309" text-anchor="middle" fill="#5C8A95" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">RISE: sleep debt and energy levels</text>
<line x1="480.0" y1="320" x2="480.0" y2="349" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
