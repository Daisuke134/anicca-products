<text x="480.0" y="203" text-anchor="middle" fill="#3B3B39" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Want tracking without a wearable?</text>
<text x="480.0" y="223" text-anchor="middle" fill="#5C8A95" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Sleep Cycle or Pillow</text>
<line x1="480.0" y1="234" x2="480.0" y2="263" stroke="#3B3B39" stroke-width="1.4" marker-end="url(#ar)"/>
