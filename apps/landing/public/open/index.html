<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anicca Open — revenue by platform and product</title>
<meta name="description" content="Anicca open startup dashboard: this month's income, spend, gross profit and MRR, by platform and by product.">
<style>
:root{--fg:#111;--mut:#6b7280;--line:#e5e7eb;--bg:#fafafa;--pos:#059669;--neg:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:40px 0 12px}.sub{color:var(--mut);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card .l{color:var(--mut);font-size:13px}.card .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.card .n{color:var(--mut);font-size:12px;margin-top:4px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.card .v{font-size:24px}}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;background:#f9fafb}th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}.na{color:#9ca3af}.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#f3f4f6;color:var(--mut);margin-left:6px}
footer{color:var(--mut);font-size:13px;margin-top:32px}a{color:inherit}
</style></head><body><main>
<h1>Anicca Open</h1>
<p class="sub">収益をプラットフォーム別・プロダクト別にすべて公開しています。最終更新: <b id="upd">…</b></p>
<section class="kpis">
 <div class="card"><div class="l">今月の収入</div><div class="v" id="k-inc">—</div><div class="n" id="k-inc-n"></div></div>
 <div class="card"><div class="l">今月の支出</div><div class="v" id="k-sp">—</div><div class="n">領収書ベース・月初から ・ <b id="k-sp-st">partial</b>（部分集計）</div></div>
 <div class="card"><div class="l">今月の粗利（収入−支出）</div><div class="v" id="k-gp">—</div><div class="n" id="k-gp-n"></div></div>
 <div class="card"><div class="l">MRR</div><div class="v" id="k-mrr">—</div><div class="n">定期課金の月額換算</div></div>
</section>
<h2>Grok Bot Ultra（費用）</h2><div class="tw"><table id="t-grok"></table></div>
<h2>受託プラットフォーム別</h2><p class="sub" style="margin:-6px 0 10px;font-size:13px">x402 財布残高（ライブ）: <b id="x402">…</b></p><div class="tw"><table id="t-free"></table></div>
<h2>その他のプラットフォーム</h2><div class="tw"><table id="t-plat"></table></div>
<h2>プロダクト別</h2><div class="tw"><table id="t-prod"></table></div>
<footer><p id="notes"></p><p>データ: <a href="data.json">data.json</a>（毎日 自動更新）。数字のないものは「未接続」と表示し、推計はしていません。</p></footer>
</main><script>
const $=id=>document.getElementById(id);
// DISPLAY CURRENCY IS USD. Sources are stored in JPY; converted with data.json fx_usdjpy. Do not switch to ¥ (成田さん 2026-10-31).
const DISPLAY_CURRENCY='USD';let FX=null;
const yen=v=>v==null?'<span class="na">—</span>':(FX?(v<0?'−':'')+'$'+(Math.abs(v)/FX).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'<span class="na">—</span>');
const chg=v=>v==null?'<span class="na">—</span>':v===0?'±$0.00':`<span class="${v>0?'pos':'neg'}">${v>0?'+':''}${yen(v)}</span>`;
const num=v=>v==null?'<span class="na">—</span>':v;
const NA0=`<td>$0.00</td><td>$0.00</td><td>$0.00</td><td>—</td>`;
function free(el,rows){let h='<tr><th>プラットフォーム</th><th>今日</th><th>今月の売上</th><th>累計の売上</th><th>前日比</th><th>応募（7日）</th><th>返信</th><th>返信率</th><th>契約</th><th>担当</th></tr>';
 for(const r of rows){const on=r.status==='live';const rr=r.reply_rate==null?'<span class="na">—</span>':Math.round(r.reply_rate*100)+'%';
  const pend=r.pending_jpy?`<span class="tag">受注済み ${yen(r.pending_jpy)}</span>`:'';
  h+=`<tr><td>${r.label}${pend}${on?'':'<span class="tag">未接続・確認済み入金なし</span>'}</td>`+(on?`<td>${yen(r.today_jpy)}</td><td>${yen(r.month_jpy)}</td><td>${yen(r.all_time_jpy)}</td><td>${chg(r.change_vs_prev_day_jpy)}</td>`:NA0)+`<td>${num(r.applications_7d)}</td><td>${num(r.replies)}</td><td>${rr}</td><td>${num(r.contracts)}</td><td>${r.owner||'—'}</td></tr>`}el.innerHTML=h}
function money(el,rows,first){let h=`<tr><th>${first}</th><th>今日</th><th>今月</th><th>累計</th><th>前日比</th><th>MRR</th></tr>`;
 for(const r of rows){const on=r.status==='live';
  h+=`<tr><td>${r.label}</td>`+(on?`<td>${yen(r.today_jpy)}</td><td>${yen(r.month_jpy)}</td><td>${yen(r.all_time_jpy)}</td><td>${chg(r.change_vs_prev_day_jpy)}</td>`:NA0)+`<td>${r.mrr_jpy==null?'<span class="na">—</span>':yen(r.mrr_jpy)}</td></tr>`;
  for(const i of r.items||[])h+=`<tr><td style="padding-left:30px;color:#6b7280;font-size:13px">${i.label}</td><td></td><td>${yen(i.month_jpy)}</td><td>${yen(i.all_time_jpy)}</td><td></td><td></td></tr>`}el.innerHTML=h}
function x402(d){const a=d.x402.treasury;fetch('https://mainnet.base.org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',data:'0x70a08231'+a.slice(2).toLowerCase().padStart(64,'0')},'latest']})}).then(r=>r.json()).then(j=>{const u=parseInt(j.result,16)/1e6;$('x402').textContent=u.toFixed(2)+' USDC（'+'$'+u.toFixed(2)+'）・'+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST 時点'}).catch(()=>{$('x402').textContent='読み込み失敗'})}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const k=d.kpis;FX=d.fx_usdjpy;if(!FX){$('upd').textContent='FX missing';return}$('upd').textContent=d.updated_at;
 $('k-inc').innerHTML=yen(k.income_month_jpy);$('k-inc-n').innerHTML=d.month+' ・ 今日 '+yen(k.income_today_jpy)+' ・ 累計 '+yen(k.income_all_time_jpy);
 $('k-sp').innerHTML=yen(k.spend_month_jpy);$('k-gp').innerHTML=k.gross_profit_month_jpy==null?(k.gross_profit_status_ja||'—'):`<span class="${k.gross_profit_month_jpy<0?'neg':'pos'}">${yen(k.gross_profit_month_jpy)}</span>`;
 $('k-mrr').innerHTML=yen(k.mrr_jpy);$('k-sp-st').textContent=k.spend_status||'';$('k-gp-n').textContent=k.gross_profit_status?('unconfirmed (partial) / '+k.gross_profit_status_ja):'';
 const usd=v=>'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 $('t-grok').innerHTML='<tr><th>項目</th><th>USD</th><th>円（参考）</th><th>メモ</th></tr>'+(d.grok_ultra||[]).map(g=>g.kind=='paid'?`<tr><td>${g.label_ja}</td><td>${usd(g.amount_usd)}</td><td>¥${g.amount_jpy.toLocaleString()}</td><td>${g.date} 決済・請求書 ${g.invoice}</td></tr>`:`<tr><td>${g.label_ja}</td><td>${usd(g.monthly_usd)}/月</td><td>¥${g.monthly_jpy.toLocaleString()}/月</td><td>${g.starts} から。旧 X Super ¥17,800/月 の置き換え（二重計上なし）</td></tr>`).join('')+`<tr><td colspan="4" style="font-size:12px;color:#6b7280">${d.fx_note||''}</td></tr>`;
 free($('t-free'),d.freelance);money($('t-plat'),d.platforms,'プラットフォーム');money($('t-prod'),d.products,'プロダクト');
 $('notes').textContent=d.notes+'（USD/JPY '+(d.fx_usdjpy||'—')+'）';x402(d);
}).catch(()=>{$('upd').textContent='読み込みに失敗しました'});
</script></body></html>
