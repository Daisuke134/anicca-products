<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anicca Open — revenue by platform and product</title>
<meta name="description" content="Anicca open startup dashboard: this month's income, spend, gross profit and MRR, by platform and by product.">
<style>
:root{--fg:#111;--mut:#6b7280;--line:#e5e7eb;--bg:#fafafa;--pos:#059669;--neg:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:40px 0 12px}.sub{color:var(--mut);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card .l{color:var(--mut);font-size:13px}.card .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.card .n{color:var(--mut);font-size:12px;margin-top:4px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.card .v{font-size:24px}}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;background:#f9fafb}th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}.na{color:#9ca3af}.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#f3f4f6;color:var(--mut);margin-left:6px}
footer{color:var(--mut);font-size:13px;margin-top:32px}a{color:inherit}
</style></head><body><main>
<h1>Anicca Open</h1>
<p class="sub">収益をプラットフォーム別・プロダクト別にすべて公開しています。最終更新: <b id="upd">…</b></p>
<section class="kpis">
 <div class="card"><div class="l">今月の収入</div><div class="v" id="k-inc">—</div><div class="n" id="k-inc-n"></div></div>
 <div class="card"><div class="l">今月の支出</div><div class="v" id="k-sp">—</div><div class="n">領収書ベース・月初から</div></div>
 <div class="card"><div class="l">今月の粗利（収入−支出）</div><div class="v" id="k-gp">—</div><div class="n"></div></div>
 <div class="card"><div class="l">MRR</div><div class="v" id="k-mrr">—</div><div class="n">定期課金の月額換算</div></div>
</section>
<h2>受託プラットフォーム別</h2><div class="tw"><table id="t-free"></table></div>
<h2>その他のプラットフォーム</h2><div class="tw"><table id="t-plat"></table></div>
<h2>プロダクト別</h2><div class="tw"><table id="t-prod"></table></div>
<footer><p id="notes"></p><p>データ: <a href="data.json">data.json</a>（毎日 自動更新）。数字のないものは「未接続」と表示し、推計はしていません。</p></footer>
</main><script>
const $=id=>document.getElementById(id);let FX=null;
const yen=v=>v==null?'<span class="na">—</span>':(v===0?'¥0':(FX?'¥'+Math.round(v*FX).toLocaleString('ja-JP'):'$'+v.toFixed(2)));
const chg=v=>v==null?'<span class="na">—</span>':v===0?'±¥0':`<span class="${v>0?'pos':'neg'}">${v>0?'+':'−'}${yen(Math.abs(v))}</span>`;
const num=v=>v==null?'<span class="na">—</span>':v;
const NA='<span class="tag">未接続</span>';
const FREE=['lancers','crowdworks','coconala','upwork','mercor','fiverr','contra','guru','truelancer'];
function free(el,rows){let h='<tr><th>プラットフォーム</th><th>今月の売上</th><th>累計の売上</th><th>前日比</th><th>応募（7日）</th><th>返信率</th><th>契約</th><th>担当</th></tr>';
 for(const r of rows){const on=r.status==='live';const rr=r.reply_rate==null?'<span class="na">—</span>':Math.round(r.reply_rate*100)+'%';
  h+=`<tr><td>${r.label}</td><td>${on?yen(r.month):NA}</td><td>${on?yen(r.all_time):NA}</td><td>${on?chg(r.change_vs_prev_day):'<span class="na">—</span>'}</td><td>${num(r.applications_7d)}</td><td>${rr}</td><td>${num(r.contracts)}</td><td>${r.owner||'—'}</td></tr>`}el.innerHTML=h}
function money(el,rows,first){let h=`<tr><th>${first}</th><th>今日</th><th>今月</th><th>累計</th><th>前日比</th><th>MRR</th></tr>`;
 for(const r of rows){const on=r.status==='live';let x=`<td>${r.label}</td>`;
  x+=on?`<td>${yen(r.today)}</td><td>${yen(r.month)}</td><td>${yen(r.all_time)}</td><td>${chg(r.change_vs_prev_day)}</td>`:`<td colspan="4">${NA}</td>`;
  x+=`<td>${r.mrr==null?'<span class="na">—</span>':yen(r.mrr)}</td>`;
  if(r.key==='contract-work')x+=`</tr><tr><td colspan="6" class="na" style="text-align:left;font-size:13px">応募 累計 ${r.applications_all}（今日 ${r.applications_today}）・返信 ${r.replies??'—'}・契約 ${r.contracts??'—'}</td>`;
  h+=`<tr>${x}</tr>`}el.innerHTML=h}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{FX=d.fx_usdjpy;const k=d.kpis;$('upd').textContent=d.updated_at;
 $('k-inc').innerHTML=yen(k.income_month_usd);$('k-inc-n').innerHTML=d.month+' ・ 今日 '+yen(k.income_today_usd);
 $('k-sp').innerHTML=yen(k.spend_month_usd);$('k-gp').innerHTML=k.gross_profit_month_usd==null?'—':`<span class="${k.gross_profit_month_usd<0?'neg':'pos'}">${k.gross_profit_month_usd<0?'−'+yen(-k.gross_profit_month_usd):yen(k.gross_profit_month_usd)}</span>`;
 $('k-mrr').innerHTML=yen(k.mrr_usd);
 free($('t-free'),d.platforms.filter(r=>FREE.includes(r.key)));money($('t-plat'),d.platforms.filter(r=>!FREE.includes(r.key)),'プラットフォーム');money($('t-prod'),d.products,'プロダクト');
 $('notes').textContent='金額は円（マネーパスの当日レート USD/JPY '+(FX?FX.toFixed(2):'—')+' で換算）。未接続 = 売上の取得元がまだない。前日比 = 累計の前日スナップショットとの差。';
}).catch(()=>{$('upd').textContent='読み込みに失敗しました'});
</script></body></html>
