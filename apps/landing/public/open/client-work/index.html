<!doctype html><html lang="ja"><head><base href="/open/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anicca Open — Client work listings</title><meta name="description" content="Every client-work listing we have, per platform: what it sells, price, views, sales, and what we are changing.">
<style>
@font-face{font-family:"Newsreader";src:url(/open/fonts/Newsreader-normal.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(/open/fonts/InstrumentSans-normal.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(/open/fonts/InstrumentSans-italic.woff2) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}
:root{--bg:#fafaf8;--ink:#1c1917;--ink2:#44403c;--mut:#78716c;--faint:#a8a29e;--line:#e3ded4;--line2:#edeae3;--accent:#c93a1e;--accent-deep:#a52e15;--pos:#1e7b45;--pos-bg:#e9f4ec;--neg:#b3261e;--warn:#9a6206;--warn-bg:#f7efdb;--serif:"Newsreader","Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",Georgia,serif;--sans:"Instrument Sans","Hiragino Kaku Gothic ProN","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

*{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.w{max-width:1180px;margin:0 auto;padding:44px 28px 72px}h1{font-family:var(--serif);font-size:33px;font-weight:560;margin:0;letter-spacing:-.01em}.sub{color:var(--mut);font-size:13.5px;margin:6px 0 18px}
.c{background:none;border:0;border-top:2px solid var(--ink);border-radius:0;padding:18px 0 4px;margin-bottom:26px;overflow-x:auto;box-shadow:none}h2{font-size:16px;font-weight:650;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}.m{color:var(--faint)}.pill{font-size:11.5px;font-weight:650;padding:0;border-radius:0;white-space:nowrap;background:none}
.weak{color:var(--neg)}.mid{color:var(--warn)}.top{color:var(--pos)}.unknown,.unpublished{color:var(--mut)}
a{color:var(--accent-deep);text-decoration:none}a:hover{text-decoration:underline}.back{font-size:12.5px}
</style></head><body><div class="w">
<div class="back"><a href="./">← Anicca Open</a></div>
<h1>Client work listings</h1>
<div class="sub" id="meta">Loading…</div>
<div class="c"><h2>By platform</h2><table id="plat"></table></div>
<div class="c"><h2>Every listing</h2><div class="m" style="margin-bottom:6px">Views = per-listing 30-day views on the date shown. UNKNOWN / — means not measured yet; it is not zero.</div><table id="list"></table></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=x=>x==null?'<span class="m">UNKNOWN</span>':esc(x);
fetch('client-work.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('client-work.json');return r.json()}).then(d=>{
 document.getElementById('meta').textContent='Updated '+d.updated_at+' · '+d.note;
 document.getElementById('plat').innerHTML='<tr><th>Platform</th><th>Account</th><th class="r">Listings</th><th>Views</th><th>Applications sent</th><th>Replies</th><th>Delivered</th><th>Revenue</th></tr>'+
  d.platforms.map(p=>`<tr><td><b>${esc(p.platform)}</b></td><td>${esc(p.account)}</td><td class="r">${esc(p.listings)}</td><td>${esc(p.views)}</td><td>${esc(p.apps)}</td><td>${esc(p.replies)}</td><td>${esc(p.deliveries)}</td><td>${esc(p.revenue)}</td></tr>`).join('');
 document.getElementById('list').innerHTML='<tr><th>Platform</th><th>Listing</th><th>Sells</th><th>Price</th><th class="r">Views</th><th class="r">Search impr.</th><th class="r">♥</th><th class="r">Sales</th><th>Status</th><th>What we are changing</th></tr>'+
  d.listings.map(l=>`<tr><td>${esc(l.platform)}</td><td>${l.url?`<a href="${esc(l.url)}" rel="noopener" target="_blank">${esc(l.title)}</a>`:esc(l.title)}</td><td>${esc(l.sells)}</td><td>${v(l.price)}</td><td class="r">${v(l.views_30d)}${l.views_measured&&l.views_30d!=null?`<div class="m">${esc(l.views_measured)}</div>`:''}</td><td class="r">${l.search_impressions==null?'<span class="m">—</span>':esc(l.search_impressions)}</td><td class="r">${v(l.favorites)}</td><td class="r">${esc(l.sales_public)}</td><td><span class="pill ${esc(l.status)}">${esc(l.status)}</span></td><td>${esc(l.action)}</td></tr>`).join('');
}).catch(e=>{document.getElementById('meta').textContent='Data unavailable: '+e.message});
</script></body></html>
