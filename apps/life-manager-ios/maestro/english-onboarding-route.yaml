# Real staging journey. The operator pre-authorizes the isolated staging tenant
# outside Maestro; this flow preserves that Keychain session and never embeds a
# token, manufactures an OAuth callback, or creates fake data.
appId: ai.anicca.life-manager
name: English real-staging onboarding to route and free chat
tags:
  - smokeTest
  - staging
  - english
env:
  PROFILE_NAME: ${PROFILE_NAME}
  PROFILE_HOME: ${PROFILE_HOME}
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "profile.name"
    timeout: 30000
- tapOn:
    id: "profile.name"
- inputText: ${PROFILE_NAME}
- tapOn:
    id: "profile.home"
- inputText: ${PROFILE_HOME}
- tapOn:
    id: "profile.productLocale"
- tapOn:
    id: "profile.locale.en"
- tapOn:
    id: "profile.continue"
- extendedWaitUntil:
    visible:
      id: "phone.skip"
    timeout: 30000
- tapOn:
    id: "phone.skip"
- extendedWaitUntil:
    visible:
      id: "analysis.phase"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "route.showDetails"
    timeout: 60000
- takeScreenshot: "english-route-card"
- tapOn:
    id: "route.showDetails"
- extendedWaitUntil:
    visible:
      id: "route.detail.close"
    timeout: 10000
- assertVisible:
    id: "route.detail.close"
- assertVisible: "Route details"
- assertVisible: "Close"
- assertNotVisible: "ルート詳細"
- assertNotVisible: "閉じる"
- takeScreenshot: "english-route-detail"
- tapOn:
    id: "route.detail.close"
- tapOn:
    id: "chat.upgrade"
- extendedWaitUntil:
    visible:
      id: "paywall.continueFree"
    timeout: 10000
- assertNotVisible:
    text: "設定"
- assertNotVisible:
    text: "ルート全体を表示"
- tapOn:
    id: "paywall.continueFree"
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 10000
- assertVisible:
    id: "chat.list"
- assertVisible: "Refresh"
- assertVisible: "Settings"
- assertVisible: "Upgrade"
- assertNotVisible: "更新"
- assertNotVisible: "設定"
- assertNotVisible: "アップグレード"
- tapOn:
    id: "chat.settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- assertVisible: "Settings"
- assertVisible: "Calendar"
- assertVisible: "Profile"
- assertVisible: "Product language"
- assertNotVisible: "設定"
- assertNotVisible: "カレンダー"
- takeScreenshot: "english-settings"
