# Preconditions: a real staging session is already authenticated and a real
# staging APNs payload has been delivered by the operator outside Maestro. The
# operator taps that notification before starting this flow (Maestro cannot
# manufacture an APNs delivery). This flow only observes the durable outbox;
# it never inserts a message or pretends that a push was delivered.
# The local payload is validated by test_harness.sh before simctl delivery. Its
# custom keys are exactly type=chat_message, messageId, and cursor.
appId: ai.anicca.life-manager
name: Push deep-link opens one durable chat message and refresh deduplicates
tags:
  - regression
  - staging
  - preauthorized
  - push
env:
  STAGING_SESSION_ID: ${STAGING_SESSION_ID}
  PUSH_MESSAGE_ID: ${PUSH_MESSAGE_ID}
  PUSH_CURSOR: ${PUSH_CURSOR}
  PUSH_MESSAGE_ACCESSIBILITY_ID: ${PUSH_MESSAGE_ACCESSIBILITY_ID}
---
- launchApp
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "${PUSH_MESSAGE_ACCESSIBILITY_ID}"
    timeout: 60000
- assertVisible:
    id: "${PUSH_MESSAGE_ACCESSIBILITY_ID}"
- tapOn:
    id: "chat.refresh"
- extendedWaitUntil:
    visible:
      id: "${PUSH_MESSAGE_ACCESSIBILITY_ID}"
    timeout: 30000
- assertVisible:
    id: "${PUSH_MESSAGE_ACCESSIBILITY_ID}"
- takeScreenshot: "push-deep-link-stable-message"
