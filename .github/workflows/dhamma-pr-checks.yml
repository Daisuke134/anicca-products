name: Dhamma PR checks

on:
  pull_request:
    paths:
      - 'web-apps/daily-dhamma-app/**'
      - '.github/workflows/dhamma-pr-checks.yml'

permissions:
  contents: read

concurrency:
  group: dhamma-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dhamma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-apps/daily-dhamma-app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web-apps/daily-dhamma-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The existing lockfile includes React 19 with lucide's React <=18 peer
      # range. Use its installation mode; no new packages or lifecycle scripts.
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run complete app test suite
        run: npm test -- --runInBand
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Build iOS JavaScript and Hermes bundle
        run: npx --no-install expo export --platform ios --max-workers 2 --output-dir /tmp/dhamma-ios-export
