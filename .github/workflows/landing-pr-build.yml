name: Landing PR build

on:
  pull_request:
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run test:telemetry
      - run: npm run build
        env:
          DASHBOARD_SNAPSHOT_URL: http://127.0.0.1:9
      - name: Read public Supabase schema (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
          if (!base || !key) {
            console.log(JSON.stringify({ schema_readback: 'unavailable', reason: 'public_config_missing' }));
            process.exit(0);
          }
          const response = await fetch(`${base.replace(/\/$/, '')}/rest/v1/`, {
            headers: { apikey: key, Authorization: `Bearer ${key}`, Accept: 'application/openapi+json' },
          });
          if (!response.ok) {
            console.log(JSON.stringify({ schema_readback: 'unavailable', http_status: response.status }));
            process.exit(0);
          }
          const spec = await response.json();
          for (const table of ['buyers', 'subscribers', 'ebook_webhook_receipts']) {
            const path = Object.keys(spec.paths || {}).find((item) => item === `/${table}` || item.endsWith(`/${table}`));
            const definition = Object.entries(spec.definitions || {})
              .find(([name]) => name.split('.').at(-1).toLowerCase() === table)?.[1];
            console.log(JSON.stringify({
              table,
              exposed: Boolean(path),
              columns: Object.keys(definition?.properties || {}).sort(),
            }));
          }
          NODE
