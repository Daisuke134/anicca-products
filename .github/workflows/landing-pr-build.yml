name: Landing PR build

on:
  pull_request:
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing-pr-build.yml'

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run test:telemetry
      - run: npm run build
        env:
          DASHBOARD_SNAPSHOT_URL: http://127.0.0.1:9
