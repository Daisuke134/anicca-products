name: Landing PR build

on:
  pull_request:
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing-pr-build.yml'

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run test:telemetry
      - run: npm run test:anicca-app-store-routing
      - name: Stage reviewed canonical Manager articles before build
        working-directory: apps/landing
        env:
          MANAGER_BLOG_REVISION: efd1b2b6183fb1bcaf850e1b09399c3ac61a5c04
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/Daisuke134/life-manager/$MANAGER_BLOG_REVISION/apps/landing/manager-blog/scripts/install.mjs" -o /tmp/manager-blog-install.mjs
          echo "c0908ffa9f899138f3f342140063b595e3b7bcab72f6e516d704290d3207e141  /tmp/manager-blog-install.mjs" | sha256sum --check
          node /tmp/manager-blog-install.mjs

      - run: npm run build
        env:
          DASHBOARD_SNAPSHOT_URL: http://127.0.0.1:9

      # Approved marketing source lives only in the canonical Life Manager repository.
      - name: Apply canonical marketing overlay (immutable revision)
        working-directory: apps/landing
        env:
          MANAGER_MARKETING_REVISION: 6f65732bbe047b3ec1dd3ec8df2ef925b9a7c2cf
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/Daisuke134/life-manager/$MANAGER_MARKETING_REVISION/apps/landing/marketing/scripts/publish-overlay.mjs" -o /tmp/manager-publish-overlay.mjs
          echo "c0236cb3d2ac4e2db06eae72360b5c53971e3fc6eb143e12406e39f9b2848298  /tmp/manager-publish-overlay.mjs" | sha256sum --check
          node /tmp/manager-publish-overlay.mjs

