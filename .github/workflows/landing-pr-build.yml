name: Landing PR build

on:
  pull_request:
    paths:
      - 'apps/landing/**'
      - 'packages/ai-monk-index/**'
      - 'scripts/test-ai-monk-factory-db.mjs'
      - '.github/workflows/landing-pr-build.yml'

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - name: Stage canonical app registry and icons before build
        working-directory: apps/landing
        env:
          MANAGER_MARKETING_REVISION: 9e1e23f0a6f2523bfaa233efda695e2349e8d141
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/Daisuke134/life-manager/$MANAGER_MARKETING_REVISION/apps/landing/marketing/scripts/publish-overlay.mjs" -o /tmp/manager-publish-overlay.mjs
          echo "ea2a20b9326138052409b18ef303d90f33575537f86807b8553f9c365e794a42  /tmp/manager-publish-overlay.mjs" | sha256sum --check
          node /tmp/manager-publish-overlay.mjs --stage

      - name: AI monk directory contracts
        run: node --test lib/ai-monk-directory.test.mjs lib/monk-factory-client.test.mjs test/ai-monk-evidence-rendering.test.mjs test/ai-monk-factory-action-readiness.test.mjs scripts/stage-ai-monk-factory.test.mjs

      - name: Product catalog overlay contracts
        run: node --test scripts/apply-products-overlay.test.mjs

      - name: AI monk factory atomic database contracts
        working-directory: .
        run: |
          node packages/ai-monk-index/scripts/build.mjs --netlify
          node scripts/test-ai-monk-factory-db.mjs

      - name: Book checkout and delivery contracts
        run: node --test netlify/functions/__tests__/ai-monk-book.test.js netlify/functions/__tests__/ebook-download.test.js netlify/functions/_lib/__tests__/ebook-checkout.test.js test/ai-monk-book-page.test.mjs

      - run: npm run test:telemetry
      - name: Site hit attribution contracts
        run: npm run test:site-hit
      - run: npm run test:anicca-app-store-routing
      - name: Stage reviewed canonical Manager articles before build
        working-directory: apps/landing
        env:
          MANAGER_BLOG_REVISION: 9a60b49e4bd4d288a491f0fb026af74e933c7eba
          # Reviewed content pin; installer and module revision remain independently pinned.
          MANAGER_BLOG_CONTENT_REVISION: ec903aa16ce2683f59a7a10e67b6cdc994c722ec
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/Daisuke134/life-manager/$MANAGER_BLOG_REVISION/apps/landing/manager-blog/scripts/install.mjs" -o /tmp/manager-blog-install.mjs
          echo "9a00fa62a6048d249b332958c1ee14a2eeeae57f2f33277b538b915bed51dbf0  /tmp/manager-blog-install.mjs" | sha256sum --check
          node /tmp/manager-blog-install.mjs

      - run: npm run build
        env:
          DASHBOARD_SNAPSHOT_URL: http://127.0.0.1:9

      # Approved marketing source lives only in the canonical Life Manager repository.
      - name: Apply canonical marketing overlay (immutable revision)
        working-directory: apps/landing
        env:
          MANAGER_MARKETING_REVISION: 9e1e23f0a6f2523bfaa233efda695e2349e8d141
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/Daisuke134/life-manager/$MANAGER_MARKETING_REVISION/apps/landing/marketing/scripts/publish-overlay.mjs" -o /tmp/manager-publish-overlay.mjs
          echo "ea2a20b9326138052409b18ef303d90f33575537f86807b8553f9c365e794a42  /tmp/manager-publish-overlay.mjs" | sha256sum --check
          node /tmp/manager-publish-overlay.mjs

      - name: Apply canonical products catalog routes only
        working-directory: apps/landing
        env:
          MANAGER_PRODUCTS_REVISION: 973d3f6e7ae02562fcbfd9c1c0cccca5011a98bd
        run: node scripts/apply-products-overlay.mjs
