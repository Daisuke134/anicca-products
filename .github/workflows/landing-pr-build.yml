name: Landing PR build

on:
  pull_request:
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run test:telemetry
      - name: Read provider metadata (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest env:list --context production --json --site "$NETLIFY_SITE_ID" 2>/dev/null \
            | node -e '
              let input="";
              process.stdin.on("data", chunk => input += chunk).on("end", () => {
                try {
                  const data = JSON.parse(input);
                  const names = Array.isArray(data)
                    ? data.map(item => typeof item === "string" ? item : item.key || item.name)
                    : data && typeof data === "object" ? Object.keys(data) : [];
                  const filteredNames = names
                    .filter(name => typeof name === "string" && /(RESEND|EMAIL|DATABASE|POSTGRES|SUPABASE|PG)/i.test(name))
                    .sort();
                  console.log(JSON.stringify({ production_env_names: filteredNames }));
                } catch {
                  console.log(JSON.stringify({ production_env_names: "unavailable" }));
                }
              });
            '
          SUPABASE_URL="$(npx --yes netlify-cli@latest env:get SUPABASE_URL --context production --site "$NETLIFY_SITE_ID" 2>/dev/null | tail -n 1 || true)"
          SUPABASE_SERVICE_ROLE_KEY="$(npx --yes netlify-cli@latest env:get SUPABASE_SERVICE_ROLE_KEY --context production --site "$NETLIFY_SITE_ID" 2>/dev/null | tail -n 1 || true)"
          RESEND_API_KEY="$(npx --yes netlify-cli@latest env:get RESEND_API_KEY --context production --site "$NETLIFY_SITE_ID" 2>/dev/null | tail -n 1 || true)"
          RESEND_FROM_EMAIL="$(npx --yes netlify-cli@latest env:get RESEND_FROM_EMAIL --context production --site "$NETLIFY_SITE_ID" 2>/dev/null | tail -n 1 || true)"
          export SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY RESEND_FROM_EMAIL
          node --input-type=module <<'NODE'
          const base = process.env.SUPABASE_URL;
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!base || !serviceKey) {
            console.log(JSON.stringify({ schema_readback: 'unavailable', reason: 'netlify_env_missing' }));
          } else {
            const root = base.replace(/\/$/, '');
            const auth = { apikey: serviceKey, Authorization: `Bearer ${serviceKey}` };
            let supabaseProjectRef = null;
            try {
              const hostname = new URL(root).hostname.toLowerCase();
              const match = /^([a-z0-9]+)\.supabase\.co$/.exec(hostname);
              supabaseProjectRef = match ? match[1] : null;
            } catch { /* The host is intentionally not logged when it is invalid. */ }
            console.log(JSON.stringify({ supabase_project_ref: supabaseProjectRef }));
            const response = await fetch(`${root}/rest/v1/`, {
              headers: { ...auth, Accept: 'application/openapi+json' },
            });
            if (!response.ok) {
              console.log(JSON.stringify({ schema_readback: 'unavailable', http_status: response.status }));
            } else {
              const spec = await response.json();
              for (const table of ['buyers', 'subscribers', 'ebook_webhook_receipts', 'ebook_subscription_states']) {
                const path = Object.keys(spec.paths || {}).find((item) => item === `/${table}` || item.endsWith(`/${table}`));
                const definition = Object.entries(spec.definitions || {})
                  .find(([name]) => name.split('.').at(-1).toLowerCase() === table)?.[1];
                console.log(JSON.stringify({
                  table,
                  exposed: Boolean(path),
                  required: definition?.required || [],
                  schema_hints: Object.keys(definition || {}).filter((key) => /key|constraint/i.test(key)),
                  columns: Object.keys(definition?.properties || {}).sort(),
                  column_types: Object.fromEntries(Object.entries(definition?.properties || {}).map(([name, column]) => [name, {
                    type: column.type || null,
                    format: column.format || null,
                    nullable: !(definition?.required || []).includes(name),
                  }])),
                }));
              }
              console.log(JSON.stringify({
                supabase_rpc_names: Object.keys(spec.paths || {})
                  .filter((item) => item.startsWith('/rpc/'))
                  .map((item) => item.slice('/rpc/'.length))
                  .sort(),
              }));
            }
            const receiptProbe = await fetch(`${root}/rest/v1/ebook_webhook_receipts?select=stripe_event_id&limit=0`, {
              headers: auth,
            });
            const receiptError = receiptProbe.ok ? null : await receiptProbe.json().catch(() => ({}));
            console.log(JSON.stringify({
              ebook_receipts_table_http_status: receiptProbe.status,
              error_code: receiptError && (receiptError.code || receiptError.name) || null,
            }));
            const indexResponse = await fetch(`${root}/rest/v1/pg_indexes?select=indexname,indexdef&schemaname=eq.public&tablename=eq.subscribers`, {
              headers: auth,
            });
            const indexBody = indexResponse.ok ? await indexResponse.json().catch(() => []) : await indexResponse.json().catch(() => ({}));
            const uniqueIndexes = Array.isArray(indexBody)
              ? indexBody.filter((row) => /\bUNIQUE\b/i.test(row.indexdef || ''))
              : [];
            console.log(JSON.stringify({
              subscribers_index_catalog_http_status: indexResponse.status,
              index_catalog_error_code: indexBody && (indexBody.code || indexBody.name) || null,
              unique_index_names: uniqueIndexes.map((row) => row.indexname).sort(),
              unique_email_index_names: uniqueIndexes.filter((row) => /email/i.test(row.indexdef || '')).map((row) => row.indexname).sort(),
            }));
            const pageSize = 500;
            const emailCounts = new Map();
            let offset = 0;
            let totalRows = null;
            let stableTotal = true;
            let scanEnded = false;
            let subscriberRowsScanned = 0;
            let emptyNormalizedEmailRows = 0;
            let scanError = null;
            while (true) {
              const pageUrl = `${root}/rest/v1/subscribers?select=email&order=id.asc&limit=${pageSize}&offset=${offset}`;
              const pageResponse = await fetch(pageUrl, { headers: { ...auth, Prefer: 'count=exact' } });
              if (!pageResponse.ok) {
                const error = await pageResponse.json().catch(() => ({}));
                scanError = { http_status: pageResponse.status, error_code: error.code || error.name || null };
                break;
              }
              const range = pageResponse.headers.get('content-range') || '';
              const rangeMatch = /\/(\d+)$/.exec(range);
              const reportedTotal = rangeMatch ? Number(rangeMatch[1]) : null;
              if (totalRows === null) totalRows = reportedTotal;
              else if (reportedTotal !== null && reportedTotal !== totalRows) stableTotal = false;
              const rows = await pageResponse.json().catch(() => null);
              if (!Array.isArray(rows)) {
                scanError = { http_status: pageResponse.status, error_code: 'invalid_json_shape' };
                break;
              }
              subscriberRowsScanned += rows.length;
              for (const row of rows) {
                const email = typeof row.email === 'string' ? row.email.trim().toLowerCase() : '';
                if (!email) {
                  emptyNormalizedEmailRows += 1;
                  continue;
                }
                emailCounts.set(email, (emailCounts.get(email) || 0) + 1);
              }
              offset += rows.length;
              if (rows.length < pageSize || (totalRows !== null && offset >= totalRows)) {
                scanEnded = true;
                break;
              }
            }
            const duplicateGroups = [...emailCounts.values()].filter((count) => count > 1);
            const scanComplete = scanEnded && (totalRows === null || subscriberRowsScanned === totalRows);
            console.log(JSON.stringify({
              subscriber_email_scan: scanError ? 'incomplete' : !stableTotal ? 'unstable_total' : scanComplete ? 'complete' : 'incomplete',
              subscriber_rows_scanned: subscriberRowsScanned,
              subscriber_rows_reported: totalRows,
              normalized_email_groups: emailCounts.size,
              duplicate_normalized_email_groups: duplicateGroups.length,
              duplicate_normalized_email_extra_rows: duplicateGroups.reduce((sum, count) => sum + count - 1, 0),
              empty_normalized_email_rows: emptyNormalizedEmailRows,
              scan_error: scanError,
            }));
          }
          const resendKey = process.env.RESEND_API_KEY;
          const sender = process.env.RESEND_FROM_EMAIL || '';
          const senderAddress = /^(?:[^<>\r\n]*<)?[^<>\s@]+@([^<>\s@]+\.[^<>\s@]+)>?$/.exec(sender.trim());
          console.log(JSON.stringify({
            resend_from_email_configured: Boolean(senderAddress),
            resend_sender_domain: senderAddress ? senderAddress[1].toLowerCase() : null,
          }));
          if (!resendKey) {
            console.log(JSON.stringify({ resend_domains: 'unavailable', reason: 'netlify_env_missing' }));
          } else {
            const domainsResponse = await fetch('https://api.resend.com/domains', {
              headers: { Authorization: `Bearer ${resendKey}` },
            });
            if (!domainsResponse.ok) {
              const error = await domainsResponse.json().catch(() => ({}));
              console.log(JSON.stringify({
                resend_domains: 'unavailable',
                http_status: domainsResponse.status,
                error_name: error.name || null,
              }));
            } else {
              const domains = await domainsResponse.json();
              console.log(JSON.stringify({
                resend_domains: (domains.data || []).map((domain) => ({
                  name: domain.name,
                  status: domain.status,
                  sending: domain.capabilities?.sending,
                })),
              }));
            }
          }
          NODE
      - run: npm run build
        env:
          DASHBOARD_SNAPSHOT_URL: http://127.0.0.1:9
