name: netlify-dns-add
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only list what would be added"
        default: "true"
permissions:
  contents: read
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Add agents.aniccaai.com records (add-only)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          T = os.environ["NETLIFY_AUTH_TOKEN"]; DRY = os.environ.get("DRY_RUN") == "true"
          API = "https://api.netlify.com/api/v1"
          def req(m, p, body=None):
              r = urllib.request.Request(API + p, method=m, data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + T, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as x: return x.status, json.loads(x.read() or b"null")
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          s, zones = req("GET", "/dns_zones")
          if s != 200: print("zones list failed", s, zones); sys.exit(1)
          z = [z for z in zones if z["name"] == "aniccaai.com"]
          if not z: print("zone aniccaai.com not visible to token"); sys.exit(1)
          zid = z[0]["id"]
          s, recs = req("GET", f"/dns_zones/{zid}/dns_records")
          if s != 200: print("records list failed", s, recs); sys.exit(1)
          have = {(r["type"], r["hostname"].rstrip(".").lower()) for r in recs}
          D = "aniccaai.com"
          want = [
            ("TXT", "resend._domainkey.agents."+D, "p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDWQID/FyKSTacaNhSGwxZeNyy8sXH1YTv9lsXg9HMdFH4f7HZsWB4a3/VJUVlM7R+tweKqS+j1FghP0H/MpGO2T6uYtRx4msLqtCErnzhBSbTkjkD4l1Y2+VG21ry39X6o6sMj4qrfAPpMDvlCWtj5AqNIdZ0t/Nn3rHkDBUF+gwIDAQAB", None),
            ("MX", "send.agents."+D, "feedback-smtp.us-east-1.amazonses.com", 10),
            ("TXT", "send.agents."+D, "v=spf1 include:amazonses.com ~all", None),
            ("CNAME", "rsend.agents."+D, "send.forge.rmta.net", None),
            ("MX", "agents."+D, "receive.forge.rmta.net", 10),
            ("TXT", "_dmarc."+D, "v=DMARC1; p=none;", None),
          ]
          fail = 0
          for t, h, v, p in want:
              if (t, h) in have or (t == "TXT" and h.startswith("_dmarc") and any(x[1] == h for x in have)):
                  print("SKIP exists", t, h); continue
              if DRY: print("WOULD ADD", t, h); continue
              b = {"type": t, "hostname": h, "value": v, "ttl": 3600}
              if p is not None: b["priority"] = p
              s, out = req("POST", f"/dns_zones/{zid}/dns_records", b)
              print("ADD", t, h, "->", s, "" if s in (200, 201) else out)
              fail += s not in (200, 201)
          sys.exit(1 if fail else 0)
          PY
